<!DOCTYPE html>
<html lang="en">

<head> <!--learned about specificty and additions of specs -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Specifcity (sorry for spelling mistakes)</title>
  <style>
    /*internal css*/
    /*1. position and order of apperance
      2. Specificty
      3. Origin
      4. Importance
    */
    /*specificity=1*/
    h1.cred { /* 1+10 = 11 so greater than 10*/
      color: aqua;
    }
    /*specificity=10*/
    .yellow {
      color: yellow;
    }
    /*specificity=10*/
    .cred {
      color: red;
    }
    /*specificity=10*/
    .cpurple {
      color: purple;
    }
    /*specificity=10 (this is an attribute selector)*/
    [data-x=a] {
      /*oh very nice feature man*/
      background-color: violet !important;
      /*IMPORTANT OVERRIDES EVERYTHING MAN*/
    }

    [data-x=a] {
      /*oh very nice feature man*/
      background-color: palegreen;
    }
  </style>
</head>

<body>
  <div>
    <h1 class="yellow cred cpurple" data-x="a">
      CSS Specifcity
    </h1>
  </div>
</body>

</html>
